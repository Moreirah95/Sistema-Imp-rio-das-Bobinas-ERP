@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    if(nome.endsWith(".zip")){var z=await JSZip.loadAsync(f);var es=Object.values(z.files).filter(function(e){return !e.dir&&e.name.toLowerCase().endsWith(".xml")});
      for(var j=0;j<es.length;j++)out.push(new TextDecoder("utf-8").decode(await es[j].async("uint8array")));}
    else if(nome.endsWith(".xml"))out.push(await f.text());}
  return out;
}
async function gravar(ref,fn){try{await fn(ref)}catch(e){if(e&&e.code==="unavailable"){await new Promise(function(r){setTimeout(r,600+Math.random()*600)});await fn(ref)}else throw e}}
var importando=false;
async function importar(files){
  if(importando||!files||!files.length)return;
  if(!carregado){status("Aguarde as notas terminarem de carregar e tente de novo.","warn");return}
  importando=true;
  try{
    status("Lendo arquivos…");
    var txs=await textos(files);
    if(!txs.length){status("Nenhum XML encontrado. Envie um arquivo .zip com os XMLs ou os próprios .xml.","err");return}
    var novas=[],jaTinha=0,ignorados=0,cancelas=[],vistos=new Set();
    txs.forEach(function(tx){var r=lerXml(tx);
      if(r.nota){if((notas.has(r.nota.chave)&&!exemplo)||vistos.has(r.nota.chave))jaTinha++;else{vistos.add(r.nota.chave);novas.push(r.nota)}}
      else if(r.cancela)cancelas.push(r.cancela);else ignorados++;});
    if(exemplo&&(novas.length)){notas.clear();exemplo=false}
    var feito=0,falhou=0;
    for(var i=0;i<novas.length;i+=40){var lote=novas.slice(i,i+40);
      status("Importando "+Math.min(i+40,novas.length)+" de "+novas.length+"…");
      try{await rpc("nfe_importar",{p_notas:lote});lote.forEach(function(n){notas.set(n.chave,n)});feito+=lote.length}
      catch(e){falhou+=lote.length}}
    var canc=0,cs=cancelas.filter(function(k){var n=notas.get(k);return n&&!n.cancelada&&!exemplo});
    if(cs.length){try{await rpc("nfe_cancelar",{p_chaves:cs});cs.forEach(function(k){notas.get(k).cancelada=true});canc=cs.length}catch(e){}}
    try{if(!novas.length&&(jaTinha||cancelas.length))mostrarUltima(await rpc("nfe_registrar_importacao"));else if(feito)await carregarUltima()}catch(e){}
    var p=[feito+(feito===1?" nota importada":" notas importadas")];
    if(jaTinha)p.push(jaTinha+" já estavam no sistema");
    if(canc)p.push(canc+" marcadas como canceladas");
    if(ignorados)p.push(ignorados+" arquivos ignorados (não são NF-e)");
    if(falhou)p.push(falhou+" não foram salvas"+"; confira a internet e importe o mesmo arquivo de novo");
    status(p.join(" · ")+".",falhou?"err":"");
    render();
  }catch(e){status("Não foi possível ler o arquivo. Confira se é um ZIP válido com XMLs de NF-e.","err")}
  finally{importando=false;$("arquivos").value=""}
}

/* ---------- tela ---------- */
function filtrar(){
  var q=$("busca").value.trim(),arr=Array.from(notas.values());
  if(q){var dig=q.replace(/\D/g,""),soNum=/^[\d.\-\/\s]+$/.test(q),nq=norm(q),nn=dig.replace(/^0+/,"");
    arr=arr.filter(function(n){
      if(soNum){return (nn&&n.nNF.indexOf(nn)>=0)||(dig.length>=5&&((n.dest.doc||"").indexOf(dig)>=0||n.chave.indexOf(dig)>=0))}
      return norm(n.dest.nome).indexOf(nq)>=0||norm(n.pedido).indexOf(nq)>=0||n.itens.some(function(i){return norm(i.x).indexOf(nq)>=0||norm(i.c).indexOf(nq)>=0});});
    if(soNum&&nn)arr.sort(function(a,b){return (b.nNF===nn)-(a.nNF===nn)||(b.dhEmi||"").localeCompare(a.dhEmi||"")});
    else arr.sort(function(a,b){return (b.dhEmi||"").localeCompare(a.dhEmi||"")});
  } else arr.sort(function(a,b){return (b.dhEmi||"").localeCompare(a.dhEmi||"")});
  return arr;
}
function render(){
  var total=exemplo?0:notas.size;
  $("count").innerHTML=!carregado?"Carregando notas…":(total?"<b>"+total.toLocaleString("pt-BR")+"</b>"+(total===1?" nota no sistema":" notas no sistema"):"Nenhuma nota importada ainda");
  var nc=0;if(!exemplo)notas.forEach(function(n){if(n.cancelada)nc++});
  $("ncanc").hidden=!nc;$("ncanc").innerHTML="<b>"+nc+"</b> "+(nc===1?"cancelada":"canceladas");
  var arr=filtrar(),q=$("busca").value.trim();
  if(!aberta||!arr.some(function(n){return n.chave===aberta}))aberta=arr.length?arr[0].chave:null;
  var h='<h2>'+(q?arr.length+(arr.length===1?" resultado":" resultados"):"Notas mais recentes")+'</h2>';
  if(!arr.length)h+='<div class="empty">'+(q?'Nenhuma NF-e encontrada para “'+esc(q)+'”. Confira o número ou importe o ZIP do dia.':'Importe um ZIP para começar.')+'</div>';
  arr.slice(0,200).forEach(function(n){
    h+='<button type="button" class="row'+(n.cancelada?' canc':'')+'" data-k="'+esc(n.chave)+'"'+(n.chave===aberta?' aria-current="true"':'')+'><span class="n">NF '+esc(n.nNF)+(n.cancelada?' <span class="tag">Cancelada</span>':'')+'</span><span class="v">'+brl(n.tot.vNF)+'</span><span class="c">'+esc(n.dest.nome)+' · '+data(n.dhEmi)+'</span></button>'});
  if(arr.length>200)h+='<div class="empty">Mostrando 200 de '+arr.length+'. Refine a pesquisa.</div>';
  $("lista").innerHTML=h;
  detalhe(aberta?notas.get(aberta):null);
}
function f(label,val,cls,w){return '<div class="f'+(w?" "+w:"")+'"><small>'+label+'</small><span class="'+(cls||"")+'">'+(val===""||val==null?"—":esc(val))+'</span></div>'}
function detalhe(n,confirmar){
  var d=$("detalhe");
  if(!n){d.innerHTML="";return}
  var saida=n.tpNF!=="0",qt=n.itens.reduce(function(s,i){return s+i.q},0);
  var h='<article class="nota'+(n.cancelada?' canc':'')+'">'+(n.cancelada?'<div class="aviso-canc">NOTA CANCELADA · não tem validade fiscal</div>':'')+'<div class="nota-top"><div><span class="num">NF-e nº '+esc(n.nNF)+'</span> <span class="mono">série '+esc(n.serie||"—")+'</span></div><div>'
    +(exemplo?'<span class="pill ex">Exemplo · some ao importar</span> ':'')
    +(n.cancelada?'<span class="pill bad">Cancelada</span>':'<span class="pill">'+(n.prot.stat==="100"||!n.prot.stat?"Autorizada":esc(n.prot.motivo||n.prot.stat))+'</span>')+'</div></div>';
  h+='<div class="grid">'+f("Valor total da nota",brl(n.tot.vNF),"big","w4")+f("Emissão",data(n.dhEmi,true),"mono","w4")+f("Operação",saida?"Saída":"Entrada","","w4")
    +f("Natureza da operação",n.natOp,"","w8")+f("Pedido",n.pedido,"mono","w4")+f("Chave de acesso",n.chave.replace(/(\d{4})/g,"$1 ").trim(),"mono","w12")+'</div>';
  h+='<div class="sec">'+(saida?"Cliente (destinatário)":"Destinatário")+'</div><div class="grid">'+f("Nome / razão social",n.dest.nome,"","w8")+f("CNPJ / CPF",docFmt(n.dest.doc),"mono","w4")
    +f("Endereço",n.dest.end,"","w6")+f("Município / UF",[n.dest.mun,n.dest.uf].filter(Boolean).join(" / "))+f("CEP",n.dest.cep,"mono")
    +f("Inscrição estadual",n.dest.ie,"mono","w4")+f("Telefone",n.dest.fone,"mono","w4")+f("E-mail",n.dest.email,"","w4")
    +f("Emitente",n.emit.nome,"","w8")+f("CNPJ do emitente",docFmt(n.emit.cnpj),"mono","w4")+'</div>';
  h+='<div class="sec">Produtos · '+n.itens.length+(n.itens.length===1?" item":" itens")+' · quantidade total '+qtd(qt)+'</div><div class="tw"><table><thead><tr><th>Código</th><th>Descrição</th><th>NCM</th><th>CFOP</th><th class="r">Qtd.</th><th>Un.</th><th class="r">Valor unit.</th><th class="r">Valor total</th></tr></thead><tbody>';
  n.itens.forEach(function(i){h+='<tr><td class="mono">'+esc(i.c)+'</td><td class="d">'+esc(i.x)+(i.ad?'<br><small style="color:var(--muted)">'+esc(i.ad)+'</small>':'')+'</td><td class="mono">'+esc(i.ncm)+'</td><td class="mono">'+esc(i.cfop)+'</td><td class="r">'+qtd(i.q)+'</td><td>'+esc(i.u)+'</td><td class="r">'+brl(i.vu)+'</td><td class="r">'+brl(i.v)+'</td></tr>'});
  h+='</tbody></table></div>';
  h+='<div class="sec">Totais</div><div class="grid">'+f("Produtos",brl(n.tot.vProd),"mono")+f("Frete",brl(n.tot.vFrete),"mono")+f("Desconto",brl(n.tot.vDesc),"mono")+f("Outras despesas",brl(n.tot.vOutro),"mono")
    +f("ICMS",brl(n.tot.vICMS),"mono")+f("ICMS ST",brl(n.tot.vST),"mono")+f("IPI",brl(n.tot.vIPI),"mono")+f("Total da nota",brl(n.tot.vNF),"mono")+'</div>';
  h+='<div class="sec">Transporte</div><div class="grid">'+f("Frete",FRETE[n.transp.mod]||n.transp.mod,"","w6")+f("Transportadora",n.transp.nome,"","w6")
    +f("Volumes",[n.transp.vol,n.transp.esp].filter(Boolean).join(" "))+f("Peso bruto (kg)",n.transp.pesoB,"mono")+f("Peso líquido (kg)",n.transp.pesoL,"mono")+f("Protocolo",n.prot.n,"mono")+'</div>';
  if(n.dups.length){h+='<div class="sec">Duplicatas</div><div class="tw"><table><thead><tr><th>Número</th><th>Vencimento</th><th class="r">Valor</th></tr></thead><tbody>';
    n.dups.forEach(function(x){h+='<tr><td class="mono">'+esc(x.n)+'</td><td class="mono">'+data(x.venc)+'</td><td class="r">'+brl(x.v)+'</td></tr>'});h+='</tbody></table></div>';}
  h+='<div class="sec">Observações da nota</div><div class="obs">'+(n.obs?esc(n.obs):'<span style="color:var(--muted)">Esta nota não tem observações.</span>')+'</div>';
  if(n.obsFisco)h+='<div class="sec">Informações de interesse do fisco</div><div class="obs">'+esc(n.obsFisco)+'</div>';
  if(!exemplo)h+='<div class="foot">'+(confirmar?'<span style="align-self:center">Excluir a NF '+esc(n.nNF)+' do sistema?</span><button type="button" id="nao">Manter</button><button type="button" class="danger" id="sim">Excluir</button>':'<button type="button" id="copiar">Copiar chave de acesso</button><button type="button" class="danger" id="excluir">Excluir nota</button>')+'</div>';
  h+='</article>';
  d.innerHTML=h;
  var b;
  if((b=$("excluir")))b.onclick=function(){detalhe(n,true)};
  if((b=$("nao")))b.onclick=function(){detalhe(n)};
  if((b=$("sim")))b.onclick=async function(){try{await rpc("nfe_excluir",{p_chave:n.chave});notas.delete(n.chave);aberta=null;status("NF "+n.nNF+" excluída.");render()}catch(e){status("Não foi possível excluir a nota. Tente de novo.","err")}};
  if((b=$("copiar")))b.onclick=function(){var el=this;try{navigator.clipboard.writeText(n.chave).then(function(){el.textContent="Chave copiada"},function(){el.textContent=n.chave})}catch(e){el.textContent=n.chave}};
}

$("lista").addEventListener("click",function(e){var r=e.target.closest(".row");if(!r)return;aberta=r.dataset.k;render();if(window.matchMedia("(max-width:860px)").matches)$("detalhe").scrollIntoView({behavior:"smooth",block:"start"})});
$("busca").addEventListener("input",function(){aberta=null;render()});
$("form").addEventListener("submit",function(e){e.preventDefault()});
$("arquivos").addEventListener("change",function(){importar(Array.from(this.files))});
var drop=$("drop");
["dragenter","dragover"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
["dragleave","drop"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();if(ev==="drop"||!e.relatedTarget)drop.classList.remove("over")})});
document.addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files.length)importar(Array.from(e.dataTransfer.files))});

/* ---------- carga inicial ---------- */
notas.set(EX.chave,EX);render();
(async function(){
  if(!TOKEN){status("Link incompleto. Abra o sistema pelo link completo que você recebeu (com a chave no final).","err");$("count").textContent="Sem acesso";$("ultima").textContent="—";return}
  try{var lidas=await rpc("nfe_listar");
    if(lidas&&lidas.length){notas.clear();exemplo=false;lidas.forEach(function(n){if(n&&n.chave)notas.set(n.chave,n)})}
    carregado=true;carregarUltima();
  }catch(e){$("ultima").textContent="—";status(e&&e.code==="acesso"?"Este link não dá acesso ao sistema. Peça o link correto a quem compartilhou.":"Não foi possível carregar as notas. Confira a internet e recarregue a página.","err");$("count").textContent="Sem conexão com o banco";return}
  aberta=null;render();
})();
})();
</script>
